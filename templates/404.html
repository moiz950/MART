{% extends 'base.html' %}
{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<section class="section-padding text-center" style="min-height: 60vh; display: flex; align-items: center;">
    <div class="container">
        <i class="fas fa-exclamation-triangle fa-5x text-purple mb-4" style="color: var(--primary);"></i>
        <h1 class="display-4">404</h1>
        <h3>Page Not Found</h3>
        <p class="text-muted">The page you are looking for might have been removed or is temporarily unavailable.</p>
        <a href="{{ url_for('index') }}" class="btn btn-purple btn-lg mt-3">Go Home</a>
    </div>
</section>
{% endblock %}
