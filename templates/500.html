{% extends 'base.html' %}
{% block title %}500 - Server Error{% endblock %}

{% block content %}
<section class="section-padding text-center" style="min-height: 60vh; display: flex; align-items: center;">
    <div class="container">
        <i class="fas fa-cogs fa-5x text-purple mb-4" style="color: var(--primary);"></i>
        <h1 class="display-4">500</h1>
        <h3>Server Error</h3>
        <p class="text-muted">Something went wrong on our end. Please try again later.</p>
        <a href="{{ url_for('index') }}" class="btn btn-purple btn-lg mt-3">Go Home</a>
    </div>
</section>
{% endblock %}
